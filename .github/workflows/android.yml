name: Android Build CI

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置JDK17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 配置Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;34.0.0 platforms;android-34'

      - name: 赋予gradlew执行权限
        run: chmod +x gradlew

      # 判断是否打tag，选择打包任务
      - name: 构建APK
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            ./gradlew assembleRelease
          else
            ./gradlew assembleDebug
          fi

      # 自动查找并重命名APK
      - name: 重命名APK
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n1)
            mv "$APK" app/build/outputs/apk/release/OpenConverter-Extended-release.apk
          else
            APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n1)
            mv "$APK" app/build/outputs/apk/debug/OpenConverter-Extended-debug.apk
          fi

      # 上传产物
      - name: 上传APK到Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OpenConverter-Extended-APK
          path: |
            android/app/build/outputs/apk/debug/OpenConverter-Extended-debug.apk
            android/app/build/outputs/apk/release/OpenConverter-Extended-release.apk
          retention-days: 30
