name: Android CI

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Decode signing keystore (if configured)
        if: env.IS_TAG == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          fi

      - name: Build Debug APK (PR / push)
        if: env.IS_TAG != 'true'
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Release APK (tags)
        if: env.IS_TAG == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_FILE" ]; then
            ./gradlew assembleRelease --stacktrace \
              -Pandroid.injected.signing.store.file="$KEYSTORE_FILE" \
              -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          else
            ./gradlew assembleRelease --stacktrace
          fi

      - name: Rename APK
        run: |
          mkdir -p output
          if [ "$IS_TAG" = "true" ]; then
            cp android/app/build/outputs/apk/release/*.apk output/OpenConverter-Extented-${{ github.ref_name }}.apk
          else
            cp android/app/build/outputs/apk/debug/*.apk output/OpenConverter-Extented-debug.apk
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenConverter-Extented-APK
          path: output/*.apk
          retention-days: 30

      - name: Create GitHub Release
        if: env.IS_TAG == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: output/*.apk
          generate_release_notes: true
