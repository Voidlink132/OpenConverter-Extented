name: Android Build CI

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 设置 Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;34.0.0 platforms;android-34'

      - name: 赋予 gradlew 执行权限
        run: chmod +x android/gradlew

      - name: 构建 Debug APK
        run: ./gradlew assembleDebug
        working-directory: android

      - name: 重命名 APK 产物
        run: mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/OpenConverter-Extented-debug.apk
        working-directory: android

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: OpenConverter-Extented-Debug-APK
          path: android/app/build/outputs/apk/debug/OpenConverter-Extented-debug.apk
          retention-days: 30
